const out = document.getElementById('output');
const subEl = document.getElementById('subtitle');
const imgOverlay = document.getElementById('imageOverlay');
const overlayImg = document.getElementById('overlayImg');
const overlayVid = document.getElementById('overlayVid');
const overlayCap = document.getElementById('overlayCaption');
let curLine = -1, playing = false, imageTimer = null;

function go() {
  document.getElementById('start').style.opacity = '0';
  setTimeout(() => document.getElementById('start').style.display = 'none', 500);
  audio.play();
  playing = true;
  document.getElementById('playBtn').textContent = '⏸';
  requestAnimationFrame(loop);
}

function togglePlay() {
  if (!playing && audio.paused) { go(); return; }
  if (audio.paused) { audio.play(); playing = true; document.getElementById('playBtn').textContent = '⏸'; requestAnimationFrame(loop); }
  else { audio.pause(); playing = false; document.getElementById('playBtn').textContent = '▶'; }
}

function cmdStop() {
  audio.pause(); audio.currentTime = 0; playing = false; curLine = -1;
  out.innerHTML = ''; subEl.textContent = ''; hideImage();
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('progressFill').style.width = '0%';
}

function seek(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * DURATION;
  out.innerHTML = ''; curLine = -1; hideImage();
  const t = audio.currentTime;
  for (let i = 0; i < LINES.length; i++) {
    if (LINES[i].t <= t) {
      if (LINES[i].type) addLine(LINES[i], true);
      if (LINES[i].sub) subEl.textContent = LINES[i].sub;
      if (LINES[i].img) showImage(LINES[i].img, LINES[i].caption);
      if (LINES[i].vid) showVideo(LINES[i].vid, LINES[i].caption);
      curLine = i;
    }
  }
  if (!playing) { playing = true; audio.play(); document.getElementById('playBtn').textContent = '⏸'; requestAnimationFrame(loop); }
}

function showImage(src, caption) {
  hideImage();
  overlayImg.src = src; overlayImg.style.display = 'block'; overlayVid.style.display = 'none';
  overlayCap.textContent = caption || '';
  imgOverlay.style.display = 'flex';
  imageTimer = setTimeout(hideImage, 4500);
}
function showVideo(src, caption) {
  hideImage();
  overlayVid.src = src; overlayVid.style.display = 'block'; overlayImg.style.display = 'none';
  overlayCap.textContent = caption || '';
  imgOverlay.style.display = 'flex';
  overlayVid.play();
  imageTimer = setTimeout(hideImage, 5500);
}
function hideImage() {
  imgOverlay.style.display = 'none'; overlayVid.pause();
  if (imageTimer) { clearTimeout(imageTimer); imageTimer = null; }
}

function fmt(s) { return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; }

function addLine(line, instant) {
  if (line.img || line.vid) return;
  const div = document.createElement('div');
  div.className = line.type === 'big' ? 'big' : (line.type || 'out');
  if (line.type === 'big') { div.textContent = line.text; out.appendChild(div); scroll(); return; }
  if (!instant && ['cmd','green','cyan'].includes(line.type)) {
    div.textContent = ''; div.classList.add('typing');
    out.appendChild(div); scroll();
    const txt = line.text; let i = 0;
    const speed = Math.max(10, Math.min(35, 1200 / txt.length));
    (function tc() {
      if (i < txt.length) { div.textContent = txt.substring(0, ++i); scroll(); setTimeout(tc, speed); }
      else div.classList.remove('typing');
    })();
  } else { div.textContent = line.text; out.appendChild(div); scroll(); }
}

function scroll() {
  while (out.children.length > 55) out.removeChild(out.firstChild);
  document.getElementById('term').scrollTop = document.getElementById('term').scrollHeight;
}

function loop() {
  if (!playing) return;
  requestAnimationFrame(loop);
  const ct = audio.currentTime;
  if (ct >= DURATION || audio.ended) { cmdStop(); return; }

  document.getElementById('progressFill').style.width = (ct / DURATION * 100) + '%';
  document.getElementById('timeLabel').textContent = fmt(ct) + ' / ' + fmt(DURATION);

  let sec = '--';
  if (ct < 10) sec = 'WHY LOCAL AI';
  else if (ct < 31) sec = 'ADVANTAGES';
  else if (ct < 43) sec = 'INSTALL';
  else if (ct < 63) sec = 'START';
  else if (ct < 94) sec = 'CLAUDE CODE';
  else if (ct < 104) sec = 'BENCHMARK';
  else if (ct < 117) sec = 'IMAGE GEN';
  else if (ct < 128) sec = 'VIDEO GEN';
  else if (ct < 133) sec = 'COMPARISON';
  else sec = 'GET STARTED';
  document.getElementById('sectionLabel').textContent = sec;

  for (let i = curLine + 1; i < LINES.length; i++) {
    if (ct >= LINES[i].t) {
      if (LINES[i].type) addLine(LINES[i], false);
      if (LINES[i].sub !== undefined) subEl.textContent = LINES[i].sub;
      if (LINES[i].img) showImage(LINES[i].img, LINES[i].caption);
      if (LINES[i].vid) showVideo(LINES[i].vid, LINES[i].caption);
      curLine = i;
    } else break;
  }
}
</script>
