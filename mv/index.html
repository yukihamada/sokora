// ── Audio (Web Audio API synth — no external file needed) ──
const AC = new (window.AudioContext||window.webkitAudioContext)();
let audio, anl;

function createSynth() {
  // Create a simple beat track using oscillators
  const osc = AC.createOscillator();
  const gain = AC.createGain();
  osc.type = 'sine';
  osc.frequency.value = 110;
  gain.gain.value = 0;
  osc.connect(gain);
  gain.connect(AC.destination);
  osc.start();

  // Use a silent audio element for timing
  audio = document.createElement('audio');
  // Generate silence data URL (3 min)
  const sr = 8000, dur = 180, samples = sr * dur;
  const buffer = new ArrayBuffer(44 + samples);
  const view = new DataView(buffer);
  // WAV header
  const writeStr = (o,s) => { for(let i=0;i<s.length;i++) view.setUint8(o+i,s.charCodeAt(i)); };
  writeStr(0,'RIFF'); view.setUint32(4,36+samples,true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,1,true); view.setUint32(24,sr,true); view.setUint32(28,sr,true);
  view.setUint16(32,1,true); view.setUint16(34,8,true);
  writeStr(36,'data'); view.setUint32(40,samples,true);
  for(let i=0;i<samples;i++) view.setUint8(44+i,128);
  const blob = new Blob([buffer],{type:'audio/wav'});
  audio.src = URL.createObjectURL(blob);

  // Beat scheduler
  let beatId;
  function scheduleBeat() {
    if (!audio.paused) {
      const ct = audio.currentTime;
      const bpm = 120;
      const beatTime = 60/bpm;
      // Kick
      const kick = AC.createOscillator();
      const kickGain = AC.createGain();
      kick.type = 'sine';
      kick.frequency.value = 60;
      kickGain.gain.setValueAtTime(0.3, AC.currentTime);
      kickGain.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.15);
      kick.connect(kickGain);
      kickGain.connect(AC.destination);
      kick.start(AC.currentTime);
      kick.stop(AC.currentTime + 0.15);

      // Hi-hat
      if (Math.random() > 0.3) {
        const noise = AC.createOscillator();
        const ng = AC.createGain();
        noise.type = 'square';
        noise.frequency.value = 4000 + Math.random() * 4000;
        ng.gain.setValueAtTime(0.05, AC.currentTime);
        ng.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.05);
        noise.connect(ng); ng.connect(AC.destination);
        noise.start(AC.currentTime); noise.stop(AC.currentTime + 0.05);
      }
    }
    beatId = setTimeout(scheduleBeat, 500);
  }
  scheduleBeat();

  // Analyzer for visualizer
  anl = AC.createAnalyser();
  anl.fftSize = 128;
  gain.connect(anl);
}

const CTX = [
  {t:2,  text:'# Homebrew, Python 3.11, MLX-LM, aiohttp を自動インストール', cls:'dim'},

  {t:105,text:'# Wan 2.1 1.3B (MPS/Apple GPU) — 使用後メモリ自動解放', cls:'dim'},

// ── Visualizer bars ──
const vizC = document.getElementById('viz');
const vizBars = [];
for(let i=0;i<64;i++){
  const b=document.createElement('div');
  b.className='vb';
  b.style.height='1px';
  vizC.appendChild(b);
  vizBars.push(b);
}

// ── State ──
let curLine=-1, curCtx=-1;
const out=document.getElementById('output');

function addLine(line){
  const div=document.createElement('div');
  let prefix='', cls='';
  switch(line.type){
    case 'sys':   prefix='  '; cls='dim'; break;
    case 'cmd':   prefix='❯ '; cls='cmd bold'; break;
    case 'run':   prefix=''; cls='green'; break;
    case 'lyric': prefix='♪ '; cls='cmd'; break;
    case 'high':
    case 'highlight': prefix=''; cls='highlight bold'; break;
    case 'warn':  prefix='  ⚠ '; cls='warn'; break;
    case 'err':   prefix='  ✗ '; cls='err bold'; break;
    case 'hr':    div.className='dim';div.textContent=line.text;out.appendChild(div);scrollTerm();return;
    case 'green': prefix=''; cls='green'; break;
    case 'pink':  prefix=''; cls='pink'; break;
    case 'purple':prefix=''; cls='purple'; break;
  }
  div.className=cls;
  if(['cmd','lyric','highlight','pink','warn','err'].includes(line.type)){
    div.textContent=prefix;
    div.classList.add('typing');
    out.appendChild(div);
    scrollTerm();
    const txt=line.text;
    let i=0;
    const speed=Math.max(15, Math.min(50, 2000/txt.length));
    function typeChar(){
      if(i<txt.length){
        div.textContent=prefix+txt.substring(0,i+1);
        i++;
        scrollTerm();
        setTimeout(typeChar, speed);
      } else {
        div.classList.remove('typing');
      }
    }
    typeChar();
  } else {
    div.textContent=prefix+line.text;
    out.appendChild(div);
    scrollTerm();
  }
}

function addCtx(line){
  const div=document.createElement('div');
  div.className=line.cls||'dim';
  div.style.fontSize='11px';
  div.style.opacity='.45';
  div.textContent=line.text;
  out.appendChild(div);
  scrollTerm();
}

function scrollTerm(){
  const term=document.getElementById('term');
  while(out.children.length>45){out.removeChild(out.firstChild);}
  term.scrollTop=term.scrollHeight;
}

function fmt(s){return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;}

function loop(){
  requestAnimationFrame(loop);
  const ct=audio.currentTime;
  const dur=audio.duration||180;

  document.getElementById('seek').value=ct;
  document.getElementById('seek').max=dur;
  document.getElementById('t-cur').textContent=fmt(ct);
  document.getElementById('t-dur').textContent=fmt(dur);

  let sec='--';
  if(ct<20) sec='INTRO';
  else if(ct<43) sec='VERSE 1';
  else if(ct<63) sec='CHORUS';
  else if(ct<88) sec='VERSE 2';
  else if(ct<112) sec='VERSE 3';
  else if(ct<133) sec='CHORUS 2';
  else if(ct<150) sec='BRIDGE';
  else sec='OUTRO';
  document.getElementById('s-section').textContent=sec;

  // Speed display
  if(ct>30 && ct<40) document.getElementById('s-speed').textContent='60 tok/s ⚡';
  else if(ct>88 && ct<95) document.getElementById('s-speed').textContent='116 tok/s ⚡⚡';
  else document.getElementById('s-speed').textContent='60 tok/s';

  for(let i=curLine+1;i<L.length;i++){
    if(ct>=L[i].t){addLine(L[i]);curLine=i;}
    else break;
  }
  for(let i=curCtx+1;i<CTX.length;i++){
    if(ct>=CTX[i].t){addCtx(CTX[i]);curCtx=i;}
    else break;
  }

  // Fake visualizer (synced to beat)
  const beat = (ct * 2) % 1;
  for(let i=0;i<64;i++){
    const v = Math.sin(i*0.3 + ct*4) * 0.5 + 0.5;
    const pulse = beat < 0.1 ? 1 : 0.3;
    const h = Math.max(1, v * pulse * 28);
    vizBars[i].style.height = h+'px';
    vizBars[i].style.background = v>.7?'var(--cyan)':v>.4?'var(--green)':'var(--dim)';
  }

  // Logo pulse
  const logo = document.getElementById('logo');
  if(beat < 0.1) {
    logo.style.opacity = '0.5';
    logo.style.transform = 'translateX(-50%) scale(1.02)';
  } else {
    logo.style.opacity = '0.25';
    logo.style.transform = 'translateX(-50%) scale(1)';
  }
}

function go(){
  document.getElementById('start').style.opacity='0';
  setTimeout(()=>document.getElementById('start').style.display='none',400);
  createSynth();
  audio.play();
  requestAnimationFrame(loop);
}
</script>
