*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0d1117;--fg:#c9d1d9;--cyan:#58a6ff;--green:#3fb950;--yellow:#e3b341;--red:#f85149;--purple:#bc8cff;--pink:#f778ba;--dim:#484f58;--border:#30363d;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',monospace;}

/* Terminal frame */
#chrome{position:fixed;top:0;left:0;right:0;height:36px;background:#161b22;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;z-index:100;}

#output{white-space:pre-wrap;word-break:break-all;}

.green{color:var(--green);}

.typing{border-right:2px solid var(--cyan);animation:blink .5s step-end infinite;}
@keyframes blink{50%{border-color:transparent}}

/* Subtitle bar — big readable lyrics */

/* Bottom bar */

#bottom .btn.stop{background:var(--red);}
#bottom .progress{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden;cursor:pointer;}
#bottom .progress-fill{height:100%;background:var(--cyan);width:0%;transition:width 0.3s;}
#bottom .time{font-size:11px;color:var(--dim);min-width:80px;text-align:right;}
#bottom .section{font-size:11px;color:var(--purple);min-width:100px;}

/* Start screen */
#start{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .5s;}
#start .logo{color:var(--cyan);font-size:clamp(12px,3vw,18px);line-height:1.4;margin-bottom:24px;text-align:center;}
#start .desc{color:var(--fg);font-size:14px;max-width:500px;text-align:center;line-height:1.8;margin-bottom:32px;}

// ============================================================
//  ENGINE
// ============================================================
const out = document.getElementById('output');
const subEl = document.getElementById('subtitle');
let curLine = -1;
let timer = null;
let startTime = 0;
let playing = false;
let currentTime = 0;
const DURATION = 170;

const audio = { currentTime: 0, paused: true };

function go() {
  document.getElementById('start').style.opacity = '0';
  setTimeout(() => document.getElementById('start').style.display = 'none', 500);
  startTime = performance.now() / 1000;
  playing = true;
  audio.paused = false;
  document.getElementById('playBtn').textContent = '⏸';
  requestAnimationFrame(loop);
  // Start beat
  startBeat();
}

function togglePlay() {
  if (!playing && startTime === 0) { go(); return; }
  playing = !playing;
  audio.paused = !playing;
  document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
  if (playing) {
    startTime = performance.now() / 1000 - currentTime;
    requestAnimationFrame(loop);
  }
}

function cmdStop() {
  playing = false;
  audio.paused = true;
  currentTime = 0;
  curLine = -1;
  startTime = 0;
  out.innerHTML = '';
  subEl.textContent = '';
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('timeLabel').textContent = '0:00 / 3:00';
  document.getElementById('sectionLabel').textContent = '--';
}

function seek(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const t = pct * DURATION;
  currentTime = t;
  startTime = performance.now() / 1000 - t;
  // Replay all lines up to this point
  out.innerHTML = '';
  curLine = -1;
  for (let i = 0; i < LINES.length; i++) {
    if (LINES[i].t <= t) {
      if (LINES[i].type) addLine(LINES[i], true);
      if (LINES[i].sub) subEl.textContent = LINES[i].sub;
      curLine = i;
    }
  }
}

function fmt(s) {
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

function addLine(line, instant) {
  const div = document.createElement('div');
  let prefix = '', cls = '';
  switch(line.type) {
    case 'big':     div.className='big'; div.textContent=line.text; out.appendChild(div); scroll(); return;
    case 'cmd':     prefix=''; cls='cmd'; break;
    case 'out':     prefix=''; cls='out'; break;
    case 'comment': prefix=''; cls='comment'; break;
    case 'green':   prefix=''; cls='green'; break;
    case 'cyan':    prefix=''; cls='cyan'; break;
    case 'yellow':  prefix=''; cls='yellow'; break;
    case 'red':     prefix=''; cls='red'; break;
    case 'pink':    prefix=''; cls='pink'; break;
    case 'purple':  prefix=''; cls='purple'; break;
    case 'dim':     prefix=''; cls='dim'; break;
    default:        prefix=''; cls='out';
  }
  div.className = cls;

  if (!instant && ['cmd','green','cyan','yellow'].includes(line.type)) {
    // Typing effect
    div.textContent = '';
    div.classList.add('typing');
    out.appendChild(div);
    scroll();
    const txt = line.text;
    let i = 0;
    const speed = Math.max(12, Math.min(40, 1500 / txt.length));
    function typeChar() {
      if (i < txt.length) {
        div.textContent = txt.substring(0, i + 1);
        i++;
        scroll();
        setTimeout(typeChar, speed);
      } else {
        div.classList.remove('typing');
      }
    }
    typeChar();
  } else {
    div.textContent = line.text;
    out.appendChild(div);
    scroll();
  }
}

function scroll() {
  const term = document.getElementById('term');
  while (out.children.length > 50) out.removeChild(out.firstChild);
  term.scrollTop = term.scrollHeight;
}

function loop() {
  if (!playing) return;
  requestAnimationFrame(loop);

  currentTime = performance.now() / 1000 - startTime;
  if (currentTime > DURATION) { cmdStop(); return; }

  // Progress
  const pct = (currentTime / DURATION) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('timeLabel').textContent = fmt(currentTime) + ' / ' + fmt(DURATION);

  // Section
  let sec = '--';
  if (currentTime < 37) sec = 'INSTALL';
  else if (currentTime < 57) sec = 'START';
  else if (currentTime < 79) sec = 'CLAUDE CODE';
  else if (currentTime < 90) sec = 'CODE GEN';
  else if (currentTime < 101) sec = 'IMAGE GEN';
  else if (currentTime < 112) sec = 'VIDEO GEN';
  else if (currentTime < 120) sec = 'MENUBAR';
  else if (currentTime < 132) sec = 'SWITCH';
  else if (currentTime < 143) sec = 'BENCHMARK';
  else sec = 'SUMMARY';
  document.getElementById('sectionLabel').textContent = sec;

  // Lines
  for (let i = curLine + 1; i < LINES.length; i++) {
    if (currentTime >= LINES[i].t) {
      if (LINES[i].type) addLine(LINES[i], false);
      if (LINES[i].sub) {
        subEl.textContent = LINES[i].sub;
        subEl.style.opacity = '1';
      }
      curLine = i;
    } else break;
  }
}

// ── Simple beat (Web Audio) ──
let beatCtx;
function startBeat() {
  try {
    beatCtx = new (window.AudioContext || window.webkitAudioContext)();
    function tick() {
      if (!playing) { setTimeout(tick, 500); return; }
      // Kick
      const o = beatCtx.createOscillator();
      const g = beatCtx.createGain();
      o.type = 'sine'; o.frequency.value = 55;
      g.gain.setValueAtTime(0.15, beatCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, beatCtx.currentTime + 0.12);
      o.connect(g); g.connect(beatCtx.destination);
      o.start(beatCtx.currentTime); o.stop(beatCtx.currentTime + 0.12);
      // Hi-hat
      if (Math.random() > 0.4) {
        const h = beatCtx.createOscillator();
        const hg = beatCtx.createGain();
        h.type = 'square'; h.frequency.value = 6000 + Math.random() * 3000;
        hg.gain.setValueAtTime(0.02, beatCtx.currentTime);
        hg.gain.exponentialRampToValueAtTime(0.001, beatCtx.currentTime + 0.04);
        h.connect(hg); hg.connect(beatCtx.destination);
        h.start(beatCtx.currentTime); h.stop(beatCtx.currentTime + 0.04);
      }
      setTimeout(tick, 500);
    }
    tick();
  } catch(e) {}
}
