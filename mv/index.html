const out = document.getElementById('output');
const subEl = document.getElementById('subtitle');
const imgOverlay = document.getElementById('imageOverlay');
const overlayImg = document.getElementById('overlayImg');
const overlayVid = document.getElementById('overlayVid');
const overlayCap = document.getElementById('overlayCaption');
let curLine = -1, startTime = 0, playing = false, currentTime = 0;
let imageTimer = null;

function go() {
  document.getElementById('start').style.opacity = '0';
  setTimeout(() => document.getElementById('start').style.display = 'none', 500);
  startTime = performance.now() / 1000;
  playing = true;
  document.getElementById('playBtn').textContent = '⏸';
  requestAnimationFrame(loop);
  startBeat();
}

function togglePlay() {
  if (!playing && startTime === 0) { go(); return; }
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
  if (playing) { startTime = performance.now() / 1000 - currentTime; requestAnimationFrame(loop); }
}

function cmdStop() {
  playing = false; currentTime = 0; curLine = -1; startTime = 0;
  out.innerHTML = ''; subEl.textContent = '';
  hideImage();
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('timeLabel').textContent = '0:00 / 3:20';
  document.getElementById('sectionLabel').textContent = '--';
}

function seek(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const t = ((e.clientX - rect.left) / rect.width) * DURATION;
  currentTime = t; startTime = performance.now() / 1000 - t;
  out.innerHTML = ''; curLine = -1; hideImage();
  for (let i = 0; i < LINES.length; i++) {
    if (LINES[i].t <= t) {
      if (LINES[i].type) addLine(LINES[i], true);
      if (LINES[i].sub) subEl.textContent = LINES[i].sub;
      if (LINES[i].img) showImage(LINES[i].img, LINES[i].caption);
      if (LINES[i].vid) showVideo(LINES[i].vid, LINES[i].caption);
      curLine = i;
    }
  }
}

function showImage(src, caption) {
  hideImage();
  overlayImg.src = src;
  overlayImg.style.display = 'block';
  overlayVid.style.display = 'none';
  overlayCap.textContent = caption || '';
  imgOverlay.style.display = 'flex';
  imageTimer = setTimeout(hideImage, 5000);
}

function showVideo(src, caption) {
  hideImage();
  overlayVid.src = src;
  overlayVid.style.display = 'block';
  overlayImg.style.display = 'none';
  overlayCap.textContent = caption || '';
  imgOverlay.style.display = 'flex';
  overlayVid.play();
  imageTimer = setTimeout(hideImage, 6000);
}

function hideImage() {
  imgOverlay.style.display = 'none';
  overlayVid.pause();
  if (imageTimer) { clearTimeout(imageTimer); imageTimer = null; }
}

function fmt(s) { return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; }

function addLine(line, instant) {
  if (line.img || line.vid) return; // handled separately
  const div = document.createElement('div');
  div.className = line.type || 'out';
  if (line.type === 'big') { div.className = 'big'; div.textContent = line.text; out.appendChild(div); scroll(); return; }

  if (!instant && ['cmd','green','cyan'].includes(line.type)) {
    div.textContent = ''; div.classList.add('typing');
    out.appendChild(div); scroll();
    const txt = line.text; let i = 0;
    const speed = Math.max(10, Math.min(35, 1200 / txt.length));
    (function typeChar() {
      if (i < txt.length) { div.textContent = txt.substring(0, ++i); scroll(); setTimeout(typeChar, speed); }
      else div.classList.remove('typing');
    })();
  } else {
    div.textContent = line.text; out.appendChild(div); scroll();
  }
}

function scroll() {
  while (out.children.length > 55) out.removeChild(out.firstChild);
  document.getElementById('term').scrollTop = document.getElementById('term').scrollHeight;
}

function loop() {
  if (!playing) return;
  requestAnimationFrame(loop);
  currentTime = performance.now() / 1000 - startTime;
  if (currentTime > DURATION) { cmdStop(); return; }

  document.getElementById('progressFill').style.width = (currentTime / DURATION * 100) + '%';
  document.getElementById('timeLabel').textContent = fmt(currentTime) + ' / ' + fmt(DURATION);

  let sec = '--';
  if (currentTime < 33) sec = 'WHY LOCAL AI';
  else if (currentTime < 53) sec = 'INSTALL';
  else if (currentTime < 69) sec = 'START';
  else if (currentTime < 85) sec = 'CLAUDE CODE';
  else if (currentTime < 97) sec = 'BENCHMARK';
  else if (currentTime < 122) sec = 'IMAGE GEN';
  else if (currentTime < 137) sec = 'VIDEO GEN';
  else if (currentTime < 150) sec = 'COMPARISON';
  else sec = 'GET STARTED';
  document.getElementById('sectionLabel').textContent = sec;

  for (let i = curLine + 1; i < LINES.length; i++) {
    if (currentTime >= LINES[i].t) {
      if (LINES[i].type) addLine(LINES[i], false);
      if (LINES[i].sub !== undefined) subEl.textContent = LINES[i].sub;
      if (LINES[i].img) showImage(LINES[i].img, LINES[i].caption);
      if (LINES[i].vid) showVideo(LINES[i].vid, LINES[i].caption);
      curLine = i;
    } else break;
  }
}

// Beat
function startBeat() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    (function tick() {
      if (playing) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = 55;
        g.gain.setValueAtTime(0.12, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.1);
        o.connect(g); g.connect(ac.destination);
        o.start(ac.currentTime); o.stop(ac.currentTime + 0.1);
      }
      setTimeout(tick, 500);
    })();
  } catch(e) {}
}
</script>
